<button
  class="app-icon-button"
  [class.app-icon-button--outline]="variant() === 'outline'"
  type="button"
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled()"
  (click)="onClick()"
>
  <ng-content />
  @if (indicator()) {
    <span class="app-icon-button__indicator" aria-hidden="true"></span>
  }
</button>
