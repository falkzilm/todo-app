<!-- The checkbox inside is the focusable, keyboard-operable control for toggling completion;
     the card itself (the host `li`) is focusable and clickable to open the task's detail view. -->
<app-checkbox
  class="app-task-item__checkbox"
  [ngModel]="task().completed"
  [ariaLabel]="task().title"
  (ngModelChange)="onToggle()"
/>

<div class="app-task-item__content">
  <p class="app-task-item__title">{{ task().title }}</p>

  @if (category() || task().startTime) {
    <div class="app-task-item__meta">
      @if (category(); as category) {
        <span class="app-task-item__category">
          <span
            class="app-task-item__category-dot"
            [style.background-color]="categoryDotColor()"
            aria-hidden="true"
          ></span>
          {{ category.name }}
        </span>
      }

      @if (task().startTime; as startTime) {
        <span class="app-task-item__time">
          <app-icon name="clock" size="xs" />
          {{ startTime }}
        </span>
      }
    </div>
  }
</div>

@if (task().priority; as priority) {
  <app-priority-badge [priority]="priority" />
}
