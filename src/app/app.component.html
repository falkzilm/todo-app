<header class="app-shell__header">
  <div class="app-shell__container">
    <h1>{{ title() }}</h1>
    <nav>
      <a routerLink="/heute" routerLinkActive="is-active" ariaCurrentWhenActive="page">Heute</a>
      <a routerLink="/kalender" routerLinkActive="is-active" ariaCurrentWhenActive="page"
        >Kalender</a
      >
    </nav>
  </div>
</header>

@if (storageUnavailable()) {
  <p class="storage-notice app-shell__container" role="status">
    Änderungen werden in dieser Sitzung nicht gespeichert.
  </p>
}

<main class="app-shell__container">
  <router-outlet />
</main>
