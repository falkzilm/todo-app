<a class="skip-link" href="#main-content">Zum Hauptinhalt springen</a>

<div class="visually-hidden" role="status" aria-live="polite">{{ announcement() }}</div>

<header class="app-shell__header">
  <div class="app-shell__container">
    <h1>{{ title() }}</h1>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page"
        >Dashboard</a
      >
      <a routerLink="/aufgaben" routerLinkActive="is-active" ariaCurrentWhenActive="page"
        >Aufgaben</a
      >
      <a routerLink="/kalender" routerLinkActive="is-active" ariaCurrentWhenActive="page"
        >Kalender</a
      >
      <a routerLink="/projekte" routerLinkActive="is-active" ariaCurrentWhenActive="page"
        >Projekte</a
      >
      <a routerLink="/einstellungen" routerLinkActive="is-active" ariaCurrentWhenActive="page"
        >Einstellungen</a
      >
    </nav>
    <div class="app-shell__user">
      <app-avatar [name]="userDisplayName()" [src]="userAvatarSrc()" [decorative]="true" />
      <span class="app-shell__user-info">
        <span class="app-shell__user-name">{{ userDisplayName() }}</span>
        <span class="app-shell__user-email">{{ userEmail() }}</span>
      </span>
    </div>
  </div>
</header>

@if (storageUnavailable()) {
  <p class="storage-notice app-shell__container" role="status">
    Änderungen werden in dieser Sitzung nicht gespeichert.
  </p>
}

<main id="main-content" class="app-shell__container" tabindex="-1">
  <router-outlet />
</main>
