<app-page-header title="Aufgaben" subtitle="Offene Aufgaben: {{ openCount() }}" />

<form class="task-form" (ngSubmit)="addTask()">
  <input
    type="text"
    name="newTask"
    placeholder="Neue Aufgabe hinzufügen"
    [(ngModel)]="newTaskTitle"
  />
  <button type="submit">Hinzufügen</button>
</form>

<button type="button" class="reset-button" (click)="resetToDemoData()">
  Auf Demo-Daten zurücksetzen
</button>

<ul class="task-list">
  @for (task of tasks(); track task.id) {
    <app-task-item
      [task]="task"
      (toggleCompleted)="toggleTask(task.id)"
      (remove)="removeTask(task.id)"
      (titleSave)="saveTitle(task.id, $event)"
      (notesSave)="saveNotes(task.id, $event)"
    />
  } @empty {
    <li>Keine Aufgaben vorhanden.</li>
  }
</ul>
